<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
body {
  font-family: "Mochiy Pop P One", system-ui, sans-serif;
  color: #fff;
  background:
    radial-gradient(800px 500px at 30% 10%, rgba(255,150,220,0.25), transparent 70%),
    radial-gradient(800px 500px at 70% 90%, rgba(150,200,255,0.2), transparent 70%),
    linear-gradient(180deg, #2a0050, #06012a);
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
#app {
  display: flex; flex-direction: column; align-items: center;
  height: 100dvh; padding: 6px 8px; gap: 6px;
  max-width: 480px; margin: 0 auto;
}
header { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.title {
  font-size: clamp(18px, 5vw, 24px);
  color: #ffd6ee;
  -webkit-text-stroke: 2.5px #4a005a; paint-order: stroke fill;
  text-shadow: 3px 3px 0 #ff66cc, 5px 5px 0 #4a005a;
  margin: 0; transform: rotate(-2deg);
}
.icon-btn {
  background: rgba(255,255,255,0.95); border: 2.5px solid #4a005a; color: #4a005a;
  padding: 5px 10px; border-radius: 999px; font-size: 13px; font-weight: 900; cursor: pointer;
  box-shadow: 2px 2px 0 #4a005a;
}
.icon-btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 #4a005a; }

.hud {
  width: 100%; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;
  background: rgba(255,255,255,0.1); border: 2.5px solid #fff;
  border-radius: 12px; padding: 6px 10px;
  font-size: 9px; letter-spacing: 0.1em; text-align: center;
}
.hud .v { color: #ffe066; font-size: 18px; margin-top: 2px; font-variant-numeric: tabular-nums; }

.row {
  width: 100%; flex: 1 0 auto; min-height: 0;
  display: flex; align-items: stretch; justify-content: center; gap: 8px;
}
.board-wrap {
  position: relative;
  display: flex; align-items: center; justify-content: center;
}
canvas#game {
  display: block; background: rgba(0,0,0,0.35);
  border: 3px solid #fff; border-radius: 10px;
  box-shadow: 0 0 16px rgba(255,150,220,0.6);
  max-height: 100%; height: auto;
}
.side {
  display: flex; flex-direction: column; gap: 6px; min-width: 70px;
}
.side .label { font-size: 9px; opacity: 0.7; letter-spacing: 0.1em; text-align: center; }
.side .next-box {
  background: rgba(0,0,0,0.35); border: 2px solid #fff; border-radius: 8px;
  padding: 4px; display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.side .next-box canvas { display: block; }
.side .chain-box {
  background: rgba(255,255,255,0.15); border: 2px solid #fff; border-radius: 8px;
  padding: 6px; text-align: center;
}
.side .chain-box .v {
  font-size: 24px; color: #ffe066; line-height: 1;
}

.banner {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none; opacity: 0; transition: opacity 0.2s;
}
.banner.show { opacity: 1; }
.banner .text {
  font-size: clamp(28px, 8vw, 42px);
  color: #ffe066; -webkit-text-stroke: 4px #4a005a; paint-order: stroke fill;
  text-shadow: 4px 4px 0 #ff66cc;
}
.banner.go .text { color: #ff5577; text-shadow: 4px 4px 0 #4a005a; }
.banner.chain .text { color: #ffe066; }

.controls {
  width: 100%; display: grid; grid-template-columns: 1.4fr 1fr; gap: 12px; padding-bottom: 4px;
}
.dpad {
  display: grid; grid-template-columns: 56px 56px 56px;
  grid-template-rows: 56px 56px; gap: 5px; justify-content: center;
}
.dpad .down { grid-column: 2; grid-row: 2; }
.dpad .left { grid-column: 1; grid-row: 2; }
.dpad .right { grid-column: 3; grid-row: 2; }
.dpad .drop  { grid-column: 2; grid-row: 1; }
.rot-pad {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px; align-items: center;
}
.pad-btn {
  background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.4); color: #fff;
  font-family: inherit; font-size: 18px; font-weight: 900; cursor: pointer;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 10px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.15);
}
.pad-btn:active { background: rgba(255,200,255,0.4); transform: scale(0.92); }
.rot-pad .pad-btn { width: 100%; aspect-ratio: 1; max-height: 56px; border-radius: 16px; font-size: 22px; }
.rot-pad .a { background: rgba(255,200,100,0.25); border-color: #ffcc55; }
.rot-pad .b { background: rgba(150,200,255,0.25); border-color: #88ccff; }

.help {
  font-size: 10px; opacity: 0.75; text-align: center; line-height: 1.6; width: 100%;
}
.help kbd { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); padding: 0 4px; border-radius: 4px; font-size: 9px; }

.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none;
  align-items: center; justify-content: center; z-index: 100; padding: 24px;
}
.overlay.show { display: flex; }
.overlay .box {
  background: linear-gradient(180deg, #4a005a, #1a0030);
  border: 4px solid #ffe066; border-radius: 16px;
  padding: 22px; text-align: center; max-width: 320px;
  box-shadow: 0 0 30px rgba(255,224,102,0.5);
}
.overlay h2 {
  margin: 0 0 6px; font-size: 26px; color: #ffe066;
  -webkit-text-stroke: 3px #4a005a; paint-order: stroke fill;
  text-shadow: 3px 3px 0 #ff66cc;
}
.overlay p { font-size: 12px; opacity: 0.85; line-height: 1.7; margin: 6px 0; }
.overlay button {
  background: #ff66cc; color: #fff; border: 3px solid #4a005a;
  padding: 12px 26px; font-family: inherit; font-size: 18px;
  border-radius: 999px; cursor: pointer; box-shadow: 4px 4px 0 #4a005a;
  margin-top: 8px;
  animation: pulse 1.4s ease-in-out infinite;
}
.overlay button:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 #4a005a; }
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.06); }
}
.score-row {
  display: flex; justify-content: space-between;
  background: rgba(255,255,255,0.1); border-radius: 8px;
  padding: 6px 10px; margin: 6px 0; font-size: 13px;
}
.score-row .v { color: #ffe066; }
</style>

<body>
<div id="app">
  <header>
    <h1 class="title">ぽよぽよ</h1>
    <div style="display:flex; gap:5px;">
      <button class="icon-btn" id="btn-mute">🔊</button>
      <button class="icon-btn" id="btn-restart">↺</button>
    </div>
  </header>
  <div class="hud">
    <div>SCORE<div class="v" id="score">0</div></div>
    <div>BEST<div class="v" id="best">0</div></div>
    <div>消し<div class="v" id="cleared">0</div></div>
  </div>

  <div class="row">
    <div class="board-wrap">
      <canvas id="game" width="192" height="384"></canvas>
      <div class="banner" id="banner"><div class="text" id="banner-text"></div></div>
    </div>
    <div class="side">
      <div class="next-box">
        <div class="label">NEXT</div>
        <canvas id="next" width="56" height="84"></canvas>
      </div>
      <div class="chain-box">
        <div class="label">CHAIN</div>
        <div class="v" id="chain-display">0</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="dpad">
      <button class="pad-btn drop"  data-act="drop">▼▼</button>
      <button class="pad-btn left"  data-act="left">◀</button>
      <button class="pad-btn down"  data-act="down">▼</button>
      <button class="pad-btn right" data-act="right">▶</button>
    </div>
    <div class="rot-pad">
      <button class="pad-btn a" data-act="rotL">↺</button>
      <button class="pad-btn b" data-act="rotR">↻</button>
    </div>
  </div>
  <div class="help">
    <kbd>← →</kbd> 移動 ・ <kbd>↓</kbd> ソフト ・ <kbd>Space</kbd> ドロップ ・ <kbd>Z</kbd>↺ <kbd>X</kbd>↻
  </div>
</div>

<div class="overlay show" id="start-overlay">
  <div class="box">
    <h2>ぽよぽよ</h2>
    <p>同じ色を <b>4個以上</b> くっつけて消そう。<br/>連鎖でドカン！</p>
    <button id="btn-start">▶ ゲーム開始</button>
  </div>
</div>
<div class="overlay" id="end-overlay">
  <div class="box">
    <h2 id="end-title">GAME OVER</h2>
    <div class="score-row"><div>SCORE</div><div class="v" id="end-score">0</div></div>
    <div class="score-row"><div>最大連鎖</div><div class="v" id="end-chain">0</div></div>
    <button id="btn-again">▶ もういちど</button>
  </div>
</div>
